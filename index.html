<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心语陪伴 · AI 情绪聊天</title>
  <style>
    :root {
      --bg: #eef7f6;
      --panel: #ffffff;
      --primary: #7ab8d7;
      --primary-deep: #5da5c9;
      --accent: #9ad9c6;
      --text: #2c3e50;
      --muted: #6f8190;
      --user-bubble: #dff1ff;
      --ai-bubble: #f1fbf7;
      --border: #d8e9ee;
      --danger: #e57d7d;
      --shadow: 0 10px 30px rgba(90, 146, 169, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 10% 10%, #f2fbff 0%, var(--bg) 45%, #e6f5f1 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid #e8f3f6;
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 640px;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px 18px;
      background: linear-gradient(180deg, #f7fdff 0%, #f2fbf8 100%);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #3d6d85;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4f778c;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #5d7a88;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 13px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(122, 184, 215, 0.2);
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status {
      margin-top: 6px;
      font-size: 12px;
      min-height: 0;
      line-height: 1.4;
    }

    .status.error { color: var(--danger); }
    .status.success { color: #53a06e; }

    .chat-area {
      display: flex;
      flex-direction: column;
      min-height: 640px;
      background: linear-gradient(180deg, #fbfeff 0%, #f8fcfa 100%);
    }

    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: #3f697c;
      background: rgba(255, 255, 255, 0.75);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 11px 13px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-wrap;
      border: 1px solid transparent;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-color: #cde6f7;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-color: #d7f0e5;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: #ffffffd9;
    }

    textarea {
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 54px;
      max-height: 160px;
      padding: 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(122, 184, 215, 0.2);
    }

    .send-btn {
      align-self: end;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      min-width: 88px;
      height: 54px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.12s ease;
    }

    .send-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .send-btn:disabled,
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .chat-area { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">心语陪伴</div>
      <p class="subtitle">把你的心情轻轻说出来，这里有一位温柔、耐心、理解你的 AI 朋友。</p>

      <div class="settings-title">系统说明</div>
      <p class="hint">仅保留本次会话的短期记忆：不做长期存储、不留存聊天内容，关闭页面后立即清空。</p>
      <div id="keyStatus" class="status"></div>
    </aside>

    <section class="chat-area">
      <div class="chat-header">AI 情绪陪伴聊天</div>
      <div id="messages" class="messages"></div>

      <div class="composer">
        <textarea id="messageInput" placeholder="比如：我最近压力很大，总觉得自己不够好..." aria-label="输入消息"></textarea>
        <button id="sendBtn" class="send-btn" type="button">发送</button>
      </div>
    </section>
  </div>

  <script>
    const API_URL = "/api/chat";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const keyStatusEl = document.getElementById("keyStatus");

    const chatHistory = [];
    let isSending = false;

    function generateLocalComfortReply(userText) {
      const lower = userText.toLowerCase();
      let focus = "你现在的感受";
      if (lower.includes("压力") || lower.includes("焦虑") || lower.includes("累")) {
        focus = "这些压力和疲惫";
      } else if (lower.includes("失眠") || lower.includes("睡")) {
        focus = "你最近休息不好的状态";
      } else if (lower.includes("工作") || lower.includes("学习")) {
        focus = "你在工作或学习上的不容易";
      } else if (lower.includes("难过") || lower.includes("委屈") || lower.includes("伤心")) {
        focus = "这份难过和委屈";
      }

      const templates = [
        `谢谢你愿意说出来。我能感受到${focus}真的不轻松，你已经很努力了。先给自己一个小小的停顿，慢慢吸气、呼气三次。你不需要一下子变好，一点点来就很勇敢。`,
        `我在认真听你说。面对${focus}，会有波动是很正常的，这不代表你不够好。今晚先完成一件最小的事，比如喝口温水、整理一下呼吸，你已经在照顾自己了。`,
        `能把心事讲出来本身就很了不起。关于${focus}，我想告诉你：你不是一个人，也不是“做得不够”。先把今天的目标缩小一点点，完成一小步就值得肯定。`
      ];
      return templates[Math.floor(Math.random() * templates.length)];
    }

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "message " + (role === "user" ? "user" : "ai");
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setKeyStatus(text, type = "") {
      keyStatusEl.textContent = text;
      keyStatusEl.className = "status" + (type ? " " + type : "");
    }

    function clearSessionMemory() {
      chatHistory.length = 0;
      inputEl.value = "";
      messagesEl.innerHTML = "";
      setKeyStatus("会话已清空。", "success");
    }

    async function sendMessage() {
      if (isSending) return;
      const userText = inputEl.value.trim();
      if (!userText) return;

      isSending = true;
      sendBtn.disabled = true;
      inputEl.disabled = true;

      addMessage("user", userText);
      inputEl.value = "";

      const typingText = "我在认真倾听你，正在组织回应...";
      addMessage("ai", typingText);
      const typingNode = messagesEl.lastElementChild;

      chatHistory.push({ role: "user", content: userText });

      const payload = {
        model: "deepseek-chat",
        temperature: 0.8,
        max_tokens: 260,
        messages: [
          {
            role: "system",
            content:
              "你是一位善解人意、温暖耐心、尊重边界的朋友型心理陪伴助手。请用中文回复。语气温柔、有共情，先理解用户情绪，再给出简短可执行的鼓励或建议。避免说教、避免评判，不要输出医疗诊断。每次回复 80~180 字。"
          },
          ...chatHistory
        ]
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errorBody = "";
          try {
            const errorData = await response.json();
            errorBody =
              (errorData && errorData.error && errorData.error.message) ||
              JSON.stringify(errorData);
          } catch (_) {
            errorBody = await response.text();
          }

          if (response.status === 402) {
            throw new Error("DeepSeek 余额不足（402）。请先充值或更换有额度的 Key。");
          }
          throw new Error("请求失败（" + response.status + "）: " + errorBody);
        }

        const data = await response.json();
        const aiText =
          data &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content
            ? data.choices[0].message.content.trim()
            : "";

        if (!aiText) {
          throw new Error("接口返回为空，请稍后重试。");
        }

        typingNode.textContent = aiText;
        chatHistory.push({ role: "assistant", content: aiText });
      } catch (err) {
        const errorMessage = err && err.message ? err.message : "请求失败，请稍后重试。";
        if (errorMessage.includes("余额不足")) {
          const localReply = generateLocalComfortReply(userText);
          typingNode.textContent = localReply + "\n\n（当前已切换为本地陪伴模式）";
          chatHistory.push({ role: "assistant", content: localReply });
        } else {
          typingNode.textContent =
            "抱抱你，我刚刚有点走神了，暂时没能成功回复。请稍后再试一次。";
        }
        setKeyStatus(errorMessage, "error");
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // 仅保留会话内短期记忆，关闭页面时主动清空。
    window.addEventListener("beforeunload", clearSessionMemory);

    addMessage("ai", "你好呀，很高兴见到你。无论你现在经历着什么，我都愿意认真听你说。");
  </script>
</body>
</html>
