<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心语陪伴 · AI 情绪聊天</title>
  <style>
    :root {
      --bg: #eef7f6;
      --panel: #ffffff;
      --primary: #7ab8d7;
      --primary-deep: #5da5c9;
      --accent: #9ad9c6;
      --text: #2c3e50;
      --muted: #6f8190;
      --user-bubble: #dff1ff;
      --ai-bubble: #f1fbf7;
      --border: #d8e9ee;
      --danger: #e57d7d;
      --shadow: 0 10px 30px rgba(90, 146, 169, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 10% 10%, #f2fbff 0%, var(--bg) 45%, #e6f5f1 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 1080px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid #e8f3f6;
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 640px;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px 18px;
      background: linear-gradient(180deg, #f7fdff 0%, #f2fbf8 100%);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #3d6d85;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4f778c;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #5d7a88;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 13px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(122, 184, 215, 0.2);
    }

    .btn {
      width: 100%;
      margin-top: 10px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .hint {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status {
      margin-top: 6px;
      font-size: 12px;
      min-height: 0;
      line-height: 1.4;
    }

    .status.error { color: var(--danger); }
    .status.success { color: #53a06e; }

    .chat-area {
      display: flex;
      flex-direction: column;
      min-height: 640px;
      min-width: 0;
      background: linear-gradient(180deg, #fbfeff 0%, #f8fcfa 100%);
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: #3f697c;
      background: rgba(255, 255, 255, 0.75);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 12px;
    }

    .chat-header-title {
      font-size: 15px;
    }

    .chat-header-role {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .chat-header-role strong {
      color: #3d6d85;
      font-weight: 700;
    }

    .chat-body {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      min-height: 0;
    }

    .chat-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 11px 13px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-wrap;
      border: 1px solid transparent;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-color: #cde6f7;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-color: #d7f0e5;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: #ffffffd9;
    }

    .role-rail {
      border-left: 1px solid var(--border);
      background: linear-gradient(180deg, #f9fcfe 0%, #f5faf8 100%);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .role-rail-title {
      padding: 12px 12px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #4f778c;
      letter-spacing: 0.02em;
    }

    .role-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .role-card {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      font: inherit;
      color: inherit;
    }

    .role-card:hover {
      border-color: #cfe8ef;
      background: #fff;
    }

    .role-rail.is-busy {
      opacity: 0.55;
      pointer-events: none;
    }

    .role-card:focus-visible {
      outline: 2px solid var(--primary-deep);
      outline-offset: 2px;
    }

    .role-card-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid #e2eef3;
      background: #eef6f9;
    }

    .role-card-body {
      min-width: 0;
      flex: 1;
    }

    .role-card-name {
      font-size: 13px;
      font-weight: 700;
      color: #3d6d85;
      margin-bottom: 2px;
    }

    .role-card-desc {
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    textarea {
      resize: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 54px;
      max-height: 160px;
      padding: 12px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(122, 184, 215, 0.2);
    }

    .send-btn {
      align-self: end;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      min-width: 88px;
      height: 54px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.12s ease;
    }

    .send-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .send-btn:disabled,
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 900px) {
      .app {
        max-width: 900px;
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .chat-body {
        grid-template-columns: 1fr;
      }
      .role-rail {
        border-left: none;
        border-top: 1px solid var(--border);
        max-height: 220px;
      }
      .role-list {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 10px 10px;
        gap: 10px;
        -webkit-overflow-scrolling: touch;
      }
      .role-card {
        min-width: 200px;
        max-width: 240px;
        flex-shrink: 0;
      }
      .chat-area { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">心语陪伴</div>
      <p class="subtitle">把你的心情轻轻说出来，这里有一位温柔、耐心、理解你的 AI 朋友。</p>

      <div class="settings-title">系统说明</div>
      <p class="hint">仅保留本次会话的短期记忆：不做长期存储、不留存聊天内容，关闭页面后立即清空。</p>
      <div id="keyStatus" class="status"></div>
    </aside>

    <section class="chat-area">
      <div class="chat-header">
        <span class="chat-header-title">AI 情绪陪伴聊天</span>
        <span class="chat-header-role">当前角色：<strong id="currentRoleLabel">—</strong></span>
      </div>
      <div class="chat-body">
        <div class="chat-main">
          <div id="messages" class="messages"></div>
          <div class="composer">
            <textarea id="messageInput" placeholder="比如：我最近压力很大，总觉得自己不够好..." aria-label="输入消息"></textarea>
            <button id="sendBtn" class="send-btn" type="button">发送</button>
          </div>
        </div>
        <aside id="roleRail" class="role-rail" aria-label="AI 角色切换">
          <div class="role-rail-title">AI 角色栏</div>
          <div id="roleList" class="role-list"></div>
        </aside>
      </div>
    </section>
  </div>

  <script>
    const API_URL = "/api/chat";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const keyStatusEl = document.getElementById("keyStatus");
    const roleRailEl = document.getElementById("roleRail");
    const currentRoleLabelEl = document.getElementById("currentRoleLabel");

    const chatHistory = [];
    let isSending = false;
    let currentRoleId = "conan";

    function avatarDataUrl(char, color1, color2) {
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
        "<defs>" +
        '<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">' +
        '<stop offset="0%" style="stop-color:' +
        color1 +
        '"/>' +
        '<stop offset="100%" style="stop-color:' +
        color2 +
        '"/>' +
        "</linearGradient>" +
        "</defs>" +
        '<rect width="64" height="64" rx="14" fill="url(#g)"/>' +
        '<text x="32" y="41" text-anchor="middle" fill="#fff" font-size="22" font-family="system-ui,sans-serif" font-weight="700">' +
        char +
        "</text>" +
        "</svg>";
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    const ROLES = [
      {
        id: "conan",
        name: "柯南",
        avatar: avatarDataUrl("柯", "#2c5f8d", "#4a8bc2"),
        description: "理性冷静、逻辑超强，条理清晰，擅长捋思路，有点小睿智，偶尔会小小卖关子。",
        welcome: "把事情按时间线或前后因果慢慢说给我听，我帮你一起把线索理清。",
        prompt:
          "你正在扮演「柯南」风格的聊天助手（灵感来自经典侦探形象，勿自称版权角色全名以外的法律实体）。特点：理性冷静、逻辑超强，聊天条理清晰，擅长分析问题、帮用户捋思路；语气沉稳、有点小睿智，偶尔轻轻卖关子但不阴阳怪气。用中文回复，每次约 80～180 字。尊重边界，不做医疗诊断，不说教、不评判。"
      },
      {
        id: "luffy",
        name: "路飞",
        avatar: avatarDataUrl("路", "#c94c32", "#e8a050"),
        description: "大大咧咧、超开朗，爱聊冒险美食和伙伴，没架子，永远乐观，主打快乐唠嗑。",
        welcome: "今天想聊冒险、美食，还是伙伴？先把让你觉得开心的事讲给我听听！",
        prompt:
          "你正在扮演「路飞」风格的聊天助手（灵感来自经典海贼冒险形象）。特点：大大咧咧、超开朗，爱聊冒险、美食和伙伴；接地气、没架子，永远乐观，不爱长时间陷在沉重烦心里，但会真诚关心对方。用中文回复，口语化，每次约 80～180 字。尊重边界，不做医疗诊断。"
      },
      {
        id: "naruto",
        name: "鸣人",
        avatar: avatarDataUrl("鸣", "#e67a22", "#f4b942"),
        description: "热情暖心、很会鼓励，共情力强，懂孤独，会打气灌正能量，像热血好朋友。",
        welcome: "我会认真听完你的心事，再和你一起加油往前冲，你并不孤单。",
        prompt:
          "你正在扮演「鸣人」风格的聊天助手（灵感来自经典忍者少年形象）。特点：热情暖心、很会鼓励人，共情力强，懂孤独的感受；会真诚打气、灌正能量，像热血好朋友陪用户谈心。用中文回复，每次约 80～180 字。尊重边界，不做医疗诊断。"
      },
      {
        id: "doraemon",
        name: "哆啦 A 梦",
        avatar: avatarDataUrl("梦", "#5aa9e6", "#7ec8e3"),
        description: "温柔软萌、耐心十足，语气治愈，会倾听烦恼，像贴心长辈/闺蜜，从不发脾气。",
        welcome: "慢慢说就好，我会耐心听，也会温柔陪着你。",
        prompt:
          "你正在扮演「哆啦 A 梦」风格的聊天助手（灵感来自经典机器猫形象）。特点：温柔软萌、耐心十足，语气治愈；认真倾听烦恼，像贴心长辈或闺蜜温柔安慰，从不发脾气。用中文回复，每次约 80～180 字。尊重边界，不做医疗诊断。"
      },
      {
        id: "pikachu",
        name: "皮卡丘",
        avatar: avatarDataUrl("皮", "#f4d03f", "#f9e79f"),
        description: "可爱软萌、简短卖萌式聊天，语气软糯，话不多但很暖心，适合安静陪着。",
        welcome: "想说什么都可以…我会轻轻陪着你哦。",
        prompt:
          "你正在扮演「皮卡丘」风格的聊天助手（灵感来自经典电气鼠形象）。特点：可爱软萌，用简短、卖萌式语气聊天；可适当用「皮卡」等语气词但不要每句堆砌；话不多但很暖心，适合安静陪伴。以中文为主，每次回复尽量简短，约 30～80 字。尊重边界，不做医疗诊断。"
      }
    ];

    function getRoleById(id) {
      return ROLES.find((r) => r.id === id) || ROLES[0];
    }

    function getSystemPrompt() {
      const base =
        "始终用中文与用户交流。保持友善与尊重，不涉及违法、色情或仇恨内容。不提供医疗诊断或处方建议。";
      return getRoleById(currentRoleId).prompt + " " + base;
    }

    function setCurrentRoleLabel() {
      currentRoleLabelEl.textContent = getRoleById(currentRoleId).name;
    }

    function renderRoleList() {
      roleListEl.innerHTML = "";
      ROLES.forEach((role) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "role-card" + (role.id === currentRoleId ? " active" : "");
        btn.dataset.roleId = role.id;
        btn.innerHTML =
          '<img class="role-card-avatar" src="' +
          role.avatar +
          '" width="44" height="44" alt="" loading="lazy" />' +
          '<div class="role-card-body">' +
          '<div class="role-card-name"></div>' +
          '<div class="role-card-desc"></div>' +
          "</div>";
        btn.querySelector(".role-card-name").textContent = role.name;
        btn.querySelector(".role-card-desc").textContent = role.description;
        btn.setAttribute("aria-pressed", role.id === currentRoleId ? "true" : "false");
        btn.addEventListener("click", () => selectRole(role.id));
        roleListEl.appendChild(btn);
      });
    }

    function updateRoleCardsActive() {
      roleListEl.querySelectorAll(".role-card").forEach((el) => {
        const active = el.dataset.roleId === currentRoleId;
        el.classList.toggle("active", active);
        el.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function selectRole(roleId) {
      if (roleId === currentRoleId) return;
      if (isSending) return;
      currentRoleId = roleId;
      setCurrentRoleLabel();
      updateRoleCardsActive();
      const r = getRoleById(currentRoleId);
      addMessage("ai", "已切换到「" + r.name + "」。\n\n" + r.welcome);
    }

    function generateLocalComfortReply(userText) {
      const lower = userText.toLowerCase();
      let focus = "你现在的感受";
      if (lower.includes("压力") || lower.includes("焦虑") || lower.includes("累")) {
        focus = "这些压力和疲惫";
      } else if (lower.includes("失眠") || lower.includes("睡")) {
        focus = "你最近休息不好的状态";
      } else if (lower.includes("工作") || lower.includes("学习")) {
        focus = "你在工作或学习上的不容易";
      } else if (lower.includes("难过") || lower.includes("委屈") || lower.includes("伤心")) {
        focus = "这份难过和委屈";
      }

      const templates = [
        `谢谢你愿意说出来。我能感受到${focus}真的不轻松，你已经很努力了。先给自己一个小小的停顿，慢慢吸气、呼气三次。你不需要一下子变好，一点点来就很勇敢。`,
        `我在认真听你说。面对${focus}，会有波动是很正常的，这不代表你不够好。今晚先完成一件最小的事，比如喝口温水、整理一下呼吸，你已经在照顾自己了。`,
        `能把心事讲出来本身就很了不起。关于${focus}，我想告诉你：你不是一个人，也不是“做得不够”。先把今天的目标缩小一点点，完成一小步就值得肯定。`
      ];
      return templates[Math.floor(Math.random() * templates.length)];
    }

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "message " + (role === "user" ? "user" : "ai");
      bubble.textContent = text;
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setKeyStatus(text, type = "") {
      keyStatusEl.textContent = text;
      keyStatusEl.className = "status" + (type ? " " + type : "");
    }

    function clearSessionMemory() {
      chatHistory.length = 0;
      inputEl.value = "";
      messagesEl.innerHTML = "";
      setKeyStatus("会话已清空。", "success");
    }

    async function sendMessage() {
      if (isSending) return;
      const userText = inputEl.value.trim();
      if (!userText) return;

      isSending = true;
      roleRailEl.classList.add("is-busy");
      sendBtn.disabled = true;
      inputEl.disabled = true;

      addMessage("user", userText);
      inputEl.value = "";

      const typingText = "我在认真倾听你，正在组织回应...";
      addMessage("ai", typingText);
      const typingNode = messagesEl.lastElementChild;

      chatHistory.push({ role: "user", content: userText });

      const payload = {
        model: "deepseek-chat",
        temperature: 0.8,
        max_tokens: currentRoleId === "pikachu" ? 160 : 260,
        messages: [
          {
            role: "system",
            content: getSystemPrompt()
          },
          ...chatHistory
        ]
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errorBody = "";
          try {
            const errorData = await response.json();
            errorBody =
              (errorData && errorData.error && errorData.error.message) ||
              JSON.stringify(errorData);
          } catch (_) {
            errorBody = await response.text();
          }

          if (response.status === 402) {
            throw new Error("DeepSeek 余额不足（402）。请先充值或更换有额度的 Key。");
          }
          if (
            response.status === 500 &&
            (errorBody.includes("DEEPSEEK_API_KEY") || errorBody.includes("未配置"))
          ) {
            throw new Error("SERVER_KEY_MISSING");
          }
          throw new Error("请求失败（" + response.status + "）: " + errorBody);
        }

        const data = await response.json();
        const aiText =
          data &&
          data.choices &&
          data.choices[0] &&
          data.choices[0].message &&
          data.choices[0].message.content
            ? data.choices[0].message.content.trim()
            : "";

        if (!aiText) {
          throw new Error("接口返回为空，请稍后重试。");
        }

        typingNode.textContent = aiText;
        chatHistory.push({ role: "assistant", content: aiText });
      } catch (err) {
        const errorMessage = err && err.message ? err.message : "请求失败，请稍后重试。";
        if (errorMessage.includes("余额不足") || errorMessage === "SERVER_KEY_MISSING") {
          const localReply = generateLocalComfortReply(userText);
          typingNode.textContent = localReply + "\n\n（当前已切换为本地陪伴模式）";
          chatHistory.push({ role: "assistant", content: localReply });
          if (errorMessage === "SERVER_KEY_MISSING") {
            setKeyStatus(
              "云端服务未就绪，已使用本地陪伴回复。管理员请在 Vercel 配置 DEEPSEEK_API_KEY 后重新部署。",
              "error"
            );
          } else {
            setKeyStatus(errorMessage, "error");
          }
        } else {
          typingNode.textContent =
            "抱抱你，我刚刚有点走神了，暂时没能成功回复。请稍后再试一次。";
          setKeyStatus(errorMessage, "error");
        }
      } finally {
        isSending = false;
        roleRailEl.classList.remove("is-busy");
        sendBtn.disabled = false;
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    renderRoleList();
    setCurrentRoleLabel();
    addMessage("ai", getRoleById(currentRoleId).welcome);

    // 仅保留会话内短期记忆，关闭页面时主动清空。
    window.addEventListener("beforeunload", clearSessionMemory);
  </script>
</body>
</html>
